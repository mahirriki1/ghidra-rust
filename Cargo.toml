[package]
name = "ghidra-rust"
version = "0.0.30"
edition = "2024"
license = "Apache-2.0"
description = "An experimental native reverse engineering desktop"

[dependencies]
base64 = "0.22"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard"] }
ghidra-decompiler = { git = "https://github.com/koute/ghidra-decompiler", rev = "268c3a406d8d964bc00ae2ead4d3e1e1373aaa27", default-features = false, features = ["demangle", "x86", "aarch64"] }
object = { version = "0.37", default-features = false, features = ["read", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled", "limits", "hooks", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[features]
capture = ["eframe/__screenshot"]
performance = []

[profile.dev.package.ghidra-decompiler]
opt-level = 2

[profile.release]
debug = 1

