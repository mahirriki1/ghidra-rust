name: Versioned native packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require matching manifest, lockfile, and version tag
        run: python3 scripts/check-release-version.py

  packages:
    needs: version
    uses: ./.github/workflows/ci.yml
