name: Native desktop correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Build original PE analysis fixture
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual C++ build tools are required' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $fixture = Join-Path $env:RUNNER_TEMP 'ghidra-rust-sample.exe'
          cmd /c "`"$vcvars`" && cl /nologo /Od /Zi /Fe:`"$fixture`" tests\fixtures\sample.c /link /EXPORT:branch_loop /EXPORT:base64_message /EXPORT:aes_sbox_prefix"
          if ($LASTEXITCODE -ne 0) { throw 'PE fixture build failed' }
          "GHIDRA_RUST_TEST_PE=$fixture" >> $env:GITHUB_ENV
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
