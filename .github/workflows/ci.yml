name: Native desktop build
# Branch builds run for pull requests only, so a push to a PR branch starts one
# run instead of two. Main is built by the automatic release workflow; other
# branches can be built on demand with workflow_dispatch.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact release snapshot to build
        required: false
        type: string
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Tests run locally before pushing (see docs/releases.md); CI builds,
      # lints, and packages only.
      - name: Check release version
        run: python3 scripts/check-release-version.py
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      # Reuse compiled dependencies (mainly the decompiler engine) between runs.
      # Caches are scoped per branch; only main's cache is shared with others.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config binutils python3 \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Build, lint, and package Linux x64
        run: bash scripts/build-linux.sh --skip-tests
      - name: Retain Linux x64 build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghidra-rust-linux-x64
          path: |
            target/dist/*-linux-x64
            target/dist/*-linux-x64.sha256
            target/dist/*-linux-x64.tar.gz
            target/dist/*-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
  windows:
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      # Reuse compiled dependencies (mainly the decompiler engine) between runs.
      # Caches are scoped per branch; only main's cache is shared with others.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build, lint, and package Windows x64
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipTests
      - name: Retain portable Windows x64 build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghidra-rust-windows-x64
          path: |
            target/dist/*.zip
            target/dist/*.zip.sha256
            target/dist/*.exe
            target/dist/*.exe.sha256
          if-no-files-found: error
          retention-days: 14
